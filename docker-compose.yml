services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    user: "0:0"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - "./:/opt/project"
      - "lake_data:/opt/project/local-lake"
      - "${USERPROFILE}/.aws:/root/.aws:ro"

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark-master
    user: "0:0"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - "./:/opt/project"
      - "lake_data:/opt/project/local-lake"
      - "${USERPROFILE}/.aws:/root/.aws:ro"

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    user: "0:0"

    depends_on:
      - postgres

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_DEFAULT_REGION: eu-central-1
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${GMAIL_ADDRESS}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${GMAIL_ADDRESS}
      PIPELINE_ALERT_EMAIL: ${GMAIL_ADDRESS}

    ports:
      - "8080:8080"

    volumes:
      - "./dags:/opt/airflow/dags"
      - "./src:/opt/project/src"
      - "./dbt:/opt/project/dbt"
      - "./data:/opt/project/data"
      - "./config:/opt/project/config"
      - "./logs:/opt/airflow/logs"
      - "lake_data:/opt/project/local-lake"
      - "${USERPROFILE}/.aws:/root/.aws:ro"

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Local
      --lastname Admin
      --role Admin
      --email admin@example.com || true;
      airflow webserver &
      airflow scheduler
      "

volumes:
  postgres_data:
  lake_data: